<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VØID // BREAKER 2026 : SINGULARITY</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Michroma&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --void: #00f3ff;
            --matter: #ff0055;
            --gold: #ffd700;
            --purple: #bf00ff;
            --bg-deep: #000008;
            --ui-border: rgba(0, 243, 255, 0.4);
            --glass: rgba(0, 8, 15, 0.85);
            --glow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            cursor: none;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .cinematic-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            background: 
                radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.7) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
            mix-blend-mode: multiply;
        }

        /* --- HUD EN JEU --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 40px;
            box-sizing: border-box;
            display: none; 
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-module {
            background: var(--glass);
            border: 1px solid var(--ui-border);
            padding: 15px 30px;
            backdrop-filter: blur(25px);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 90% 100%, 0 100%);
        }

        .label {
            font-family: 'Syncopate', sans-serif;
            font-size: 8px;
            letter-spacing: 4px;
            color: var(--void);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .value {
            font-family: 'Michroma', sans-serif;
            font-size: 22px;
            color: #fff;
            text-shadow: var(--glow);
        }

        /* --- INDICATEURS DE POWER-UP --- */
        #powerup-container {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pu-timer {
            width: 150px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
            display: none; /* Caché sauf si actif */
            animation: slideIn 0.3s ease-out;
        }

        .pu-bar {
            height: 4px;
            background: var(--void);
            width: 100%;
            transform-origin: left;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* --- MENUS --- */
        #main-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 10%;
            background: radial-gradient(circle at 20% 50%, rgba(0,10,20,0.6) 0%, transparent 70%);
            transition: opacity 0.8s, transform 1s ease-in-out;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            gap: 40px;
            pointer-events: auto;
        }

        .brand-header {
            border-left: 4px solid var(--void);
            padding-left: 30px;
        }

        .main-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(40px, 8vw, 90px);
            font-weight: 700;
            color: #fff;
            letter-spacing: -6px;
            line-height: 0.8;
            margin: 0;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.4);
            font-family: 'Syncopate';
            font-size: 16px;
            letter-spacing: 8px;
            text-align: left;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            padding: 10px 0;
            outline: none;
        }

        .nav-item:hover { color: #fff; padding-left: 30px; text-shadow: var(--glow); }

        .full-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(40px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .board-card {
            width: 90%;
            max-width: 600px;
            background: var(--glass);
            border: 1px solid var(--ui-border);
            padding: 50px;
            position: relative;
        }

        .settings-grid { display: flex; flex-direction: column; gap: 30px; margin-top: 30px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; }

        #warning-msg {
            position: absolute;
            top: 35%; width: 100%;
            text-align: center;
            font-family: 'Syncopate';
            font-size: 32px;
            color: var(--matter);
            opacity: 0;
            text-shadow: 0 0 20px var(--matter);
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="cinematic-overlay"></div>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between;">
            <div class="hud-module">
                <div class="label">Signal Spectral</div>
                <div id="score" class="value">00000000</div>
            </div>
            <div class="hud-module" style="text-align: right;">
                <div class="label">Statut Coque</div>
                <div id="hull" class="value">100%</div>
            </div>
        </div>

        <div id="powerup-container">
            <div id="pu-surge" class="pu-timer">
                <div class="label" style="color:var(--gold)">Chrono-Surge</div>
                <div class="pu-bar" id="bar-surge" style="background:var(--gold)"></div>
            </div>
            <div id="pu-vector" class="pu-timer">
                <div class="label" style="color:var(--purple)">Multi-Vecteur</div>
                <div class="pu-bar" id="bar-vector" style="background:var(--purple)"></div>
            </div>
        </div>

        <div style="align-self: center; text-align: center;">
            <div id="core-label" class="label" style="font-size:11px; margin-bottom:12px;">SYSTÈME: VOID</div>
            <div id="core-status" style="width:50px; height:50px; border-radius:50%; background:var(--void); box-shadow:var(--glow); margin: 0 auto; transition: 0.6s;"></div>
        </div>
    </div>

    <div id="main-menu">
        <div class="menu-content">
            <div class="brand-header">
                <h1 class="main-title" id="terminal-title">VØID<br>BREAKER</h1>
                <div class="sub-title">Protocole Singularity // 2026</div>
            </div>
            <nav class="nav-links">
                <button class="nav-item" id="start-btn">ENGAGER PILOTE</button>
                <button class="nav-item" id="scores-btn">DATA VAULT</button>
                <button class="nav-item" id="settings-btn">PARAMÈTRES SYSTÈME</button>
            </nav>
        </div>
    </div>

    <div id="leaderboard-overlay" class="full-overlay">
        <div class="board-card">
            <div class="label" style="font-size: 24px; margin-bottom: 40px; color: #fff;">Archives de Combat</div>
            <div id="leaderboard-list"></div>
            <button class="nav-item close-overlay" style="margin-top: 40px; font-size: 12px; color: var(--void);">DÉCONNEXION</button>
        </div>
    </div>

    <div id="settings-overlay" class="full-overlay">
        <div class="board-card">
            <div class="label" style="font-size: 24px; margin-bottom: 20px; color: #fff;">Configuration Système</div>
            <div class="settings-grid">
                <div class="setting-row">
                    <span class="setting-label">Volume Principal</span>
                    <input type="range" id="volume-slider" min="0" max="100" value="80">
                </div>
                <div class="setting-row">
                    <span class="setting-label">Sensibilité Pilote</span>
                    <input type="range" id="sens-slider" min="50" max="150" value="100">
                </div>
            </div>
            <button class="nav-item close-overlay" style="margin-top: 40px; font-size: 12px; color: var(--void);">SAUVEGARDER & QUITTER</button>
        </div>
    </div>

    <div id="warning-msg">BRÈCHE CRITIQUE DÉTECTÉE</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const CONFIG = {
            colors: { void: 0x00f3ff, matter: 0xff0055, gold: 0xffd700, purple: 0xbf00ff },
            difficulty: 1.0,
            settings: JSON.parse(localStorage.getItem('void_breaker_settings')) || { volume: 80, sensitivity: 100 }
        };

        const STATE = {
            active: false,
            score: 0, hp: 100, polarity: 0, frame: 0,
            mouse: new THREE.Vector2(),
            shipPos: new THREE.Vector3(0, -15, 0), shipVel: new THREE.Vector3(),
            records: JSON.parse(localStorage.getItem('void_singularity_records')) || [],
            powers: { surge: 0, vector: 0 } // Timers en frames
        };

        // --- MOTEUR ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000008, 0.007);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.4, 0.85);
        composer.addPass(bloom);

        // --- OBJETS ---
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 4000; i++) starPos.push((Math.random()-0.5)*1200, (Math.random()-0.5)*1000, (Math.random()-1.0)*1000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.5, color: 0xffffff, transparent: true, opacity: 0.5 }));
        scene.add(stars);

        class Ship {
            constructor() {
                this.group = new THREE.Group();
                const geo = new THREE.OctahedronGeometry(1.6, 1); geo.scale(1, 2.2, 0.5);
                const mat = new THREE.MeshStandardMaterial({ color: 0x010101, metalness: 1, roughness: 0.05, emissive: CONFIG.colors.void, emissiveIntensity: 2 });
                this.mesh = new THREE.Mesh(geo, mat); this.mesh.rotation.x = Math.PI/2;
                this.light = new THREE.PointLight(CONFIG.colors.void, 3, 25);
                this.group.add(this.mesh, this.light); scene.add(this.group);
            }
            update() {
                if (STATE.active) {
                    const sens = CONFIG.settings.sensitivity / 100;
                    STATE.shipVel.x += (STATE.mouse.x * 50 * sens - STATE.shipPos.x) * 0.08;
                    STATE.shipVel.y += (STATE.mouse.y * 35 * sens - STATE.shipPos.y) * 0.08;
                    STATE.shipVel.multiplyScalar(0.82); STATE.shipPos.add(STATE.shipVel);
                    this.group.position.copy(STATE.shipPos); this.group.rotation.z = -STATE.shipVel.x * 0.05;
                } else {
                    const t = Date.now() * 0.001; this.group.position.y = Math.sin(t) * 2 - 5; this.group.rotation.y += 0.005;
                    camera.position.x = Math.cos(t * 0.2) * 20; camera.position.z = 40 + Math.sin(t * 0.2) * 10; camera.lookAt(0, -5, 0);
                }
                const col = STATE.polarity === 0 ? CONFIG.colors.void : CONFIG.colors.matter;
                this.mesh.material.emissive.setHex(col); this.light.color.setHex(col);
            }
            shoot() {
                const fireRate = STATE.powers.surge > 0 ? 3 : 6;
                if (STATE.frame % fireRate === 0) {
                    if (STATE.powers.vector > 0) {
                        for(let i=-2; i<=2; i++) spawnBullet(STATE.shipPos.x, STATE.shipPos.y, i*0.4, 2.5, 'player', STATE.polarity);
                    } else {
                        spawnBullet(STATE.shipPos.x - 1.5, STATE.shipPos.y, 0, 2.5, 'player', STATE.polarity);
                        spawnBullet(STATE.shipPos.x + 1.5, STATE.shipPos.y, 0, 2.5, 'player', STATE.polarity);
                    }
                    playSfx(STATE.polarity === 0 ? 900 : 450, 0.1, 'sine', 0.05);
                }
            }
        }

        class Enemy {
            constructor(mesh) { this.mesh = mesh; this.active = false; this.hp = 0; this.type = 0; }
            spawn(x, y, type) {
                this.active = true; this.mesh.visible = true; this.x = x; this.y = y; this.type = type;
                this.hp = 20 + (STATE.score / 500);
                this.mesh.material.emissive.setHex(type === 0 ? CONFIG.colors.void : CONFIG.colors.matter);
            }
            update() {
                this.y -= 0.22 * CONFIG.difficulty; this.mesh.position.set(this.x, this.y, 0); this.mesh.rotation.z += 0.04;
                if (this.y < -55) this.despawn();
            }
            despawn() { this.active = false; this.mesh.visible = false; }
        }

        class PowerUp {
            constructor(mesh) { this.mesh = mesh; this.active = false; this.type = ''; }
            spawn(x, y, type) {
                this.active = true; this.mesh.visible = true; this.x = x; this.y = y; this.type = type;
                const col = type === 'surge' ? CONFIG.colors.gold : (type === 'vector' ? CONFIG.colors.purple : CONFIG.colors.void);
                this.mesh.material.color.setHex(col);
                this.mesh.material.emissive.setHex(col);
            }
            update() {
                this.y -= 0.15; this.mesh.position.set(this.x, this.y, 0); this.mesh.rotation.y += 0.05;
                if (this.y < -55) this.despawn();
                if (Math.abs(this.x - STATE.shipPos.x) < 3 && Math.abs(this.y - STATE.shipPos.y) < 3) {
                    this.collect();
                }
            }
            collect() {
                if(this.type === 'surge') STATE.powers.surge = 600;
                else if(this.type === 'vector') STATE.powers.vector = 600;
                else if(this.type === 'aegis') { STATE.hp = Math.min(100, STATE.hp + 30); updateUI(); }
                playSfx(1500, 0.4, 'triangle', 0.1);
                this.despawn();
            }
            despawn() { this.active = false; this.mesh.visible = false; }
        }

        const POOL = { bullets: [], enemies: [], powers: [] };

        function spawnBullet(x, y, vx, vy, owner, type) {
            let b = POOL.bullets.find(i => !i.active);
            if (!b) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.8, 6), new THREE.MeshBasicMaterial());
                mesh.rotation.x = Math.PI/2; scene.add(mesh);
                b = { active: false, mesh }; POOL.bullets.push(b);
            }
            b.active = true; b.mesh.visible = true; b.x = x; b.y = y; b.vx = vx; b.vy = vy; b.owner = owner; b.type = type;
            b.mesh.material.color.setHex(type === 0 ? CONFIG.colors.void : CONFIG.colors.matter);
        }

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(f, d, t = 'sine', vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const g = audioCtx.createGain(); const o = audioCtx.createOscillator();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            o.frequency.exponentialRampToValueAtTime(f/10, audioCtx.currentTime + d);
            g.gain.setValueAtTime(vol * (CONFIG.settings.volume/100), audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
        }

        // --- CŒUR ---
        let ship;
        const enemyGeo = new THREE.IcosahedronGeometry(1.5, 0);
        const puGeo = new THREE.OctahedronGeometry(1);

        function init() {
            ship = new Ship();
            for (let i = 0; i < 60; i++) {
                const m = new THREE.Mesh(enemyGeo, new THREE.MeshStandardMaterial({ metalness: 1, roughness: 0.1, emissiveIntensity: 4 }));
                m.visible = false; scene.add(m); POOL.enemies.push(new Enemy(m));
            }
            for (let i = 0; i < 5; i++) {
                const m = new THREE.Mesh(puGeo, new THREE.MeshStandardMaterial({ emissiveIntensity: 5 }));
                m.visible = false; scene.add(m); POOL.powers.push(new PowerUp(m));
            }
            renderRecords(); initSettingsUI(); animate();
        }

        function update() {
            ship.update(); if (!STATE.active) return;
            STATE.frame++; CONFIG.difficulty = 1 + (STATE.score / 50000);

            // Gestion HUD Power-up
            ['surge', 'vector'].forEach(p => {
                const el = document.getElementById(`pu-${p}`);
                if(STATE.powers[p] > 0) {
                    STATE.powers[p]--;
                    el.style.display = 'block';
                    document.getElementById(`bar-${p}`).style.transform = `scaleX(${STATE.powers[p] / 600})`;
                } else { el.style.display = 'none'; }
            });

            if (STATE.frame % Math.floor(30 / CONFIG.difficulty) === 0) {
                const e = POOL.enemies.find(i => !i.active);
                if (e) e.spawn((Math.random()-0.5)*110, 60, Math.random() > 0.5 ? 0 : 1);
            }

            POOL.bullets.forEach(b => {
                if (!b.active) return;
                b.x += b.vx; b.y += b.vy; b.mesh.position.set(b.x, b.y, 0);
                if (Math.abs(b.y) > 70) { b.active = false; b.mesh.visible = false; }
                if (b.owner === 'player') {
                    const hit = POOL.enemies.find(e => e.active && Math.abs(e.x - b.x) < 3.5 && Math.abs(e.y - b.y) < 3.5);
                    if (hit) {
                        hit.hp -= b.type === hit.type ? 10 : 30; b.active = false; b.mesh.visible = false;
                        if (hit.hp <= 0) { 
                            STATE.score += 200; hit.despawn(); updateUI(); 
                            if(Math.random() < 0.15) spawnPower(hit.x, hit.y);
                            playSfx(150, 0.4, 'square', 0.1); 
                        }
                    }
                } else {
                    if (Math.abs(b.x - STATE.shipPos.x) < 2.5 && Math.abs(b.y - STATE.shipPos.y) < 2.5) {
                        b.active = false; b.mesh.visible = false;
                        if (b.type === STATE.polarity) { STATE.hp = Math.min(100, STATE.hp + 1); STATE.score += 50; }
                        else { STATE.hp -= 20; if (STATE.hp <= 0) gameOver(); }
                        updateUI();
                    }
                }
            });

            POOL.enemies.forEach(e => { if (e.active) e.update(); if (e.active && Math.random() < 0.02) spawnBullet(e.x, e.y, 0, -0.9, 'enemy', e.type); });
            POOL.powers.forEach(p => { if (p.active) p.update(); });
            stars.position.z += 2.5 * CONFIG.difficulty; if (stars.position.z > 500) stars.position.z = 0;
            if (STATE.mouse.click) ship.shoot();
        }

        function spawnPower(x, y) {
            const types = ['surge', 'vector', 'aegis'];
            const type = types[Math.floor(Math.random() * types.length)];
            const pu = POOL.powers.find(p => !p.active);
            if(pu) pu.spawn(x, y, type);
        }

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(STATE.score).toString().padStart(8, '0');
            document.getElementById('hull').innerText = `${STATE.hp}%`;
            document.getElementById('hull').style.color = STATE.hp < 30 ? 'var(--matter)' : '#fff';
        }

        function gameOver() {
            STATE.active = false;
            saveRecord(STATE.score); // Sauvegarde immédiate
            renderRecords(); // Mise à jour immédiate de l'affichage du Data Vault
            
            document.getElementById('terminal-title').innerHTML = "SIGNAL<br>PERDU";
            setTimeout(() => { 
                document.getElementById('ui-layer').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
                document.getElementById('main-menu').style.opacity = 1;
            }, 1000);
        }

        function saveRecord(s) {
            const date = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            STATE.records.push({ score: Math.floor(s), date });
            STATE.records.sort((a,b) => b.score - a.score);
            STATE.records = STATE.records.slice(0, 5);
            localStorage.setItem('void_singularity_records', JSON.stringify(STATE.records));
        }

        function renderRecords() {
            const list = document.getElementById('leaderboard-list');
            if (STATE.records.length === 0) {
                list.innerHTML = `<div class="label" style="opacity:0.3; text-align:center;">AUCUNE DONNÉE TROUVÉE</div>`;
                return;
            }
            list.innerHTML = STATE.records.map((r, i) => `
                <div class="score-entry ${i === 0 ? 'top' : ''}">
                    <span>#0${i+1}</span>
                    <span>${r.score.toString().padStart(8, '0')}</span>
                    <span style="font-size:10px; opacity:0.5; text-align:right;">${r.date}</span>
                </div>
            `).join('');
        }

        function initSettingsUI() {
            document.getElementById('volume-slider').addEventListener('input', (e) => { CONFIG.settings.volume = e.target.value; localStorage.setItem('void_breaker_settings', JSON.stringify(CONFIG.settings)); });
            document.getElementById('sens-slider').addEventListener('input', (e) => { CONFIG.settings.sensitivity = e.target.value; localStorage.setItem('void_breaker_settings', JSON.stringify(CONFIG.settings)); });
        }

        window.addEventListener('mousemove', e => { STATE.mouse.x = (e.clientX/window.innerWidth)*2-1; STATE.mouse.y = -(e.clientY/window.innerHeight)*2+1; });
        window.addEventListener('mousedown', e => { if(e.button===0) STATE.mouse.click=true; if(e.button===2) switchPol(); });
        window.addEventListener('mouseup', () => STATE.mouse.click=false);
        window.addEventListener('keydown', e => { if(e.code==='Space') switchPol(); });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function switchPol() {
            if(!STATE.active) return; STATE.polarity = 1 - STATE.polarity;
            const isV = STATE.polarity === 0; const c = isV ? 'var(--void)' : 'var(--matter)';
            document.getElementById('core-status').style.background = c;
            document.getElementById('core-label').innerText = `SYSTÈME: ${isV?'VOID':'MATTER'}`;
            document.getElementById('core-label').style.color = c;
            playSfx(250, 0.2, 'triangle', 0.2);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            STATE.active = true; STATE.hp = 100; STATE.score = 0; STATE.powers = { surge:0, vector:0 };
            document.getElementById('main-menu').style.opacity = 0;
            setTimeout(() => { document.getElementById('main-menu').style.display='none'; document.getElementById('ui-layer').style.display='flex'; }, 500);
            updateUI();
        });

        document.getElementById('scores-btn').addEventListener('click', () => {
            renderRecords(); // Assure que les scores sont à jour avant l'affichage
            document.getElementById('leaderboard-overlay').style.display='flex';
        });
        document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-overlay').style.display='flex');
        document.querySelectorAll('.close-overlay').forEach(b => b.addEventListener('click', () => document.querySelectorAll('.full-overlay').forEach(o=>o.style.display='none')));

        function animate() { requestAnimationFrame(animate); update(); composer.render(); }
        init();
    </script>
</body>
</html>
