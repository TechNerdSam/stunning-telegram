<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VØID // BREAKER : ETERNITY [AAA]</title>
    
    <!-- Typographie Cinématique -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* --- CORE DESIGN SYSTEM 2026 --- */
        :root {
            --void: #00f3ff;   /* Cyan Électrique */
            --matter: #ff0055; /* Magenta Plasma */
            --gold: #ffcc00;   /* Or Solaire */
            --dark: #020205;   /* Noir Profond */
            --ui-glass: rgba(10, 20, 40, 0.6);
            --ui-border: rgba(255, 255, 255, 0.1);
            --scanline: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0; background: var(--dark); overflow: hidden;
            font-family: 'Rajdhani', sans-serif; color: white;
            cursor: none; user-select: none;
        }

        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        /* --- FX OVERLAYS --- */
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(circle, transparent 40%, #000 120%);
        }
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 6;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .damage-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 7;
            box-shadow: inset 0 0 0 0 var(--matter);
            transition: box-shadow 0.1s ease-out;
            mix-blend-mode: overlay;
        }

        /* --- CURSOR --- */
        #cursor {
            position: fixed; width: 30px; height: 30px;
            border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 9999;
            mix-blend-mode: difference; transition: transform 0.1s;
        }
        #cursor::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: var(--void); border-radius: 50%;
        }

        /* --- HUD (HEADS UP DISPLAY) --- */
        #hud {
            position: absolute; inset: 0; z-index: 10;
            padding: 40px; display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none; transition: opacity 0.5s;
        }
        .hidden { opacity: 0; pointer-events: none; }

        .hud-module {
            background: var(--ui-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--ui-border);
            padding: 15px 30px;
            transform: skewX(-10deg);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .hud-module::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: var(--void); box-shadow: 0 0 10px var(--void);
        }
        .hud-module.right::before { left: auto; right: 0; background: var(--matter); box-shadow: 0 0 10px var(--matter); }
        
        .label { font-family: 'Share Tech Mono'; font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.6); margin-bottom: 5px; transform: skewX(10deg); }
        .value { font-family: 'Orbitron'; font-size: 32px; font-weight: 700; transform: skewX(10deg); text-shadow: 0 0 15px currentColor; }

        /* --- MENUS --- */
        .menu-layer {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 3, 10, 0.85); backdrop-filter: blur(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; pointer-events: none; clip-path: circle(0% at 50% 50%);
        }
        .menu-layer.active { opacity: 1; pointer-events: auto; clip-path: circle(150% at 50% 50%); }

        .title-container { text-align: center; margin-bottom: 60px; position: relative; }
        .glitch-title {
            font-family: 'Orbitron'; font-weight: 900; font-size: clamp(60px, 10vw, 120px);
            line-height: 0.8; letter-spacing: -5px;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .glitch-title::after {
            content: 'VØID BREAKER'; position: absolute; left: 0; top: 0;
            width: 100%; height: 100%; opacity: 0.5;
            color: var(--void); z-index: -1;
            transform: translate(4px, 4px); mix-blend-mode: screen;
            animation: glitch-anim 2s infinite;
        }

        .btn-group { display: flex; flex-direction: column; gap: 20px; width: 300px; }
        .cyber-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            padding: 20px; color: white; font-family: 'Rajdhani'; font-weight: 700; font-size: 18px;
            letter-spacing: 4px; text-transform: uppercase; cursor: none;
            position: relative; overflow: hidden; transition: 0.3s;
        }
        .cyber-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .cyber-btn:hover { border-color: var(--void); text-shadow: 0 0 10px var(--void); background: rgba(0, 243, 255, 0.05); }
        .cyber-btn:hover::before { left: 100%; }

        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 60% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        /* --- NOTIFICATIONS --- */
        #notification-area {
            position: absolute; top: 20%; width: 100%; text-align: center;
            pointer-events: none; z-index: 20;
        }
        .notify-msg {
            font-family: 'Orbitron'; font-size: 40px; font-weight: 800; letter-spacing: 5px;
            text-shadow: 0 0 20px currentColor; opacity: 0; transform: scale(1.5);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .notify-msg.show { opacity: 1; transform: scale(1); }

    </style>

    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- VISUAL LAYERS -->
    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="damage-overlay" id="damage-fx"></div>
    <div id="cursor"></div>

    <!-- NOTIFICATIONS -->
    <div id="notification-area">
        <div id="notify-text" class="notify-msg">SYSTEM READY</div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div class="hud-module">
                <div class="label">SIGNAL SPECTRAL</div>
                <div id="score" class="value" style="color:var(--void)">000000</div>
            </div>
            <div class="hud-module right">
                <div class="label">INTÉGRITÉ COQUE</div>
                <div id="hp" class="value" style="color:var(--matter)">100%</div>
            </div>
        </div>
        
        <!-- Polarité Indicator (Centre Bas) -->
        <div style="align-self: center; text-align: center; transform: translateY(-40px);">
            <div id="polarity-icon" style="
                width: 60px; height: 60px; border: 2px solid var(--void); 
                border-radius: 50%; margin: 0 auto 10px; 
                box-shadow: 0 0 20px var(--void); background: rgba(0, 243, 255, 0.1);
                transition: 0.3s; position: relative;">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; background: white; border-radius: 50%;"></div>
            </div>
            <div id="polarity-text" style="font-family: 'Share Tech Mono'; letter-spacing: 4px; color: var(--void); font-size: 12px;">SYSTEM: VOID</div>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="menu-layer active">
        <div class="title-container">
            <div style="font-family: 'Share Tech Mono'; letter-spacing: 5px; color: var(--matter); margin-bottom: 10px;">PROJECT: ETERNITY</div>
            <div class="glitch-title">VØID</div>
            <div class="glitch-title" style="font-size: clamp(30px, 5vw, 60px); color: white; -webkit-text-fill-color: white;">BREAKER</div>
        </div>
        <div class="btn-group">
            <button class="cyber-btn" onclick="GAME.start()">ENGAGER SYSTÈME</button>
            <button class="cyber-btn" onclick="alert('Contrôles: SOURIS pour bouger/tirer. CLIC DROIT ou ESPACE pour changer de couleur.')">DONNÉES TACTIQUES</button>
        </div>
    </div>

    <!-- PAUSE -->
    <div id="pause-menu" class="menu-layer">
        <div class="glitch-title" style="font-size: 80px;">PAUSE</div>
        <div class="btn-group">
            <button class="cyber-btn" onclick="GAME.togglePause()">REPRENDRE</button>
            <button class="cyber-btn" onclick="GAME.quit()">ABANDONNER</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over" class="menu-layer">
        <div class="glitch-title" style="font-size: 80px; color: var(--matter); -webkit-text-fill-color: var(--matter);">SIGNAL PERDU</div>
        <div style="font-family: 'Orbitron'; font-size: 40px; margin: 20px 0; text-shadow: 0 0 20px white;">SCORE: <span id="final-score">0</span></div>
        <div class="btn-group">
            <button class="cyber-btn" onclick="GAME.start()">RÉINITIALISER</button>
            <button class="cyber-btn" onclick="GAME.quit()">MENU PRINCIPAL</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- CUSTOM SHADER: DIGITAL GLITCH (RGB SHIFT + NOISE) ---
        const GlitchShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "amount": { value: 0.0 },
                "seed": { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float amount;
                uniform float seed;
                varying vec2 vUv;

                float rand(vec2 co){
                    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
                }

                void main() {
                    vec2 p = vUv;
                    float xs = floor(gl_FragCoord.x / 0.5);
                    float ys = floor(gl_FragCoord.y / 0.5);
                    
                    // Glitch displacement
                    if(amount > 0.0) {
                        float disp = (rand(vec2(floor(p.y * 20.0) + seed, seed)) - 0.5) * amount * 0.2;
                        p.x += disp;
                    }

                    // RGB Shift
                    float shift = amount * 0.02;
                    vec4 cr = texture2D(tDiffuse, p + vec2(shift, 0.0));
                    vec4 cg = texture2D(tDiffuse, p);
                    vec4 cb = texture2D(tDiffuse, p - vec2(shift, 0.0));

                    gl_FragColor = vec4(cr.r, cg.g, cb.b, 1.0);
                }
            `
        };

        // --- CONSTANTS ---
        const COLORS = { 
            void: 0x00f3ff, 
            matter: 0xff0055, 
            gold: 0xffcc00,
            white: 0xffffff,
            darkMetal: 0x111111 
        };
        const LIMITS = { x: 35, y: 60 };

        // --- GAME STATE ---
        const STATE = {
            active: false, paused: false, gameOver: false,
            score: 0, hp: 100, polarity: 0, // 0 = Void, 1 = Matter
            frame: 0, 
            shake: 0, glitch: 0
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.008); // Deep fog for depth

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, -10, 35);
        camera.rotation.x = 0.3;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Perf balance
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // 1. Unreal Bloom (Neon Glow)
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.85);
        composer.addPass(bloomPass);

        // 2. Custom Glitch Pass
        const glitchPass = new ShaderPass(GlitchShader);
        composer.addPass(glitchPass);

        // --- LIGHTING ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 2.0);
        sun.position.set(20, 50, 20);
        scene.add(sun);
        const backLight = new THREE.DirectionalLight(COLORS.void, 1.0);
        backLight.position.set(-20, 10, -20);
        scene.add(backLight);

        // --- ASSETS GENERATION ---
        
        // 1. Warp Grid (Moving Floor)
        const gridHelper = new THREE.GridHelper(400, 100, COLORS.void, 0x111111);
        gridHelper.position.y = -50;
        gridHelper.position.z = -50;
        scene.add(gridHelper);

        // 2. Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 4000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) starPos[i] = (Math.random()-0.5)*800;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8}));
        scene.add(stars);

        // --- ENTITIES ---

        // PLAYER SHIP (High Poly Procedural)
        const ship = new THREE.Group();
        
        // Fuselage (Blanc céramique)
        const hullMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.2, metalness: 0.5 });
        const hull = new THREE.Mesh(new THREE.ConeGeometry(1.2, 6, 6), hullMat);
        hull.rotation.x = -Math.PI/2;
        hull.rotation.y = Math.PI/6; // Align hex
        
        // Cockpit (Verre noir)
        const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.5), new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0, metalness: 1 }));
        cockpit.position.set(0, 0.5, 0.5);
        cockpit.rotation.x = -0.5;

        // Ailes (Bleu nuit technologique)
        const wingGeo = new THREE.BufferGeometry();
        const wingVerts = new Float32Array([
            0,0,0,  4,-2,0,  0,-5,0, // Aile D
            0,0,0, -4,-2,0,  0,-5,0  // Aile G
        ]);
        wingGeo.setAttribute('position', new THREE.BufferAttribute(wingVerts, 3));
        wingGeo.computeVertexNormals();
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x0a1020, roughness: 0.4, metalness: 0.8, side: THREE.DoubleSide });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.y = -0.5;

        // Moteurs (Chrome & Glow)
        const engGeo = new THREE.CylinderGeometry(0.5, 0.3, 2, 8);
        const engMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 1.0, roughness: 0.2 });
        const engL = new THREE.Mesh(engGeo, engMat); engL.position.set(1.5, -2, 0); engL.rotation.x = -Math.PI/2;
        const engR = new THREE.Mesh(engGeo, engMat); engR.position.set(-1.5, -2, 0); engR.rotation.x = -Math.PI/2;
        
        // Lumières Moteurs
        const engineLight = new THREE.PointLight(COLORS.void, 3, 15);
        engineLight.position.set(0, -3, 1);
        
        ship.add(hull, cockpit, wings, engL, engR, engineLight);
        scene.add(ship);
        ship.position.y = -20;

        // POOLS
        const bullets = [];
        const enemies = [];
        const enemyBullets = [];
        const particles = [];

        // --- LOGIC FUNCTIONS ---

        function createExplosion(pos, color, scale=1) {
            for(let i=0; i<8 * scale; i++) {
                const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                
                // Random velocity
                const vel = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).normalize().multiplyScalar(Math.random()*2);
                
                scene.add(mesh);
                particles.push({ mesh, vel, life: 1.0 });
            }
        }

        function spawnEnemy() {
            const grp = new THREE.Group();
            
            // Core Geometry (Rotating fractal-like)
            const type = Math.random() > 0.5 ? 0 : 1;
            const col = type === 0 ? COLORS.void : COLORS.matter;
            
            const coreGeo = new THREE.IcosahedronGeometry(1.5, 0);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: col, emissiveIntensity: 2, roughness: 0.1 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            
            // Orbiting Rings
            const ringGeo = new THREE.TorusGeometry(2.5, 0.1, 4, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x555555, wireframe: true });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            const ring2 = new THREE.Mesh(ringGeo, ringMat); ring2.rotation.x = Math.PI/2;
            
            grp.add(core, ring1, ring2);
            grp.position.set((Math.random()-0.5)*60, 70, 0);
            
            grp.userData = { hp: 30, type: type, active: true };
            scene.add(grp);
            enemies.push(grp);
        }

        function notify(text, color) {
            const el = document.getElementById('notify-text');
            el.innerText = text;
            el.style.color = color;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        // --- GLOBAL GAME CONTROLLER ---
        window.GAME = {
            start() {
                STATE.active = true; STATE.paused = false; STATE.gameOver = false;
                STATE.score = 0; STATE.hp = 100;
                
                // Reset Arrays
                [bullets, enemies, enemyBullets, particles].forEach(arr => {
                    arr.forEach(obj => { if(obj.mesh) scene.remove(obj.mesh); else scene.remove(obj); });
                    arr.length = 0;
                });

                ship.position.set(0, -20, 0);
                
                // UI
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('game-over').classList.remove('active');
                document.getElementById('hud').classList.remove('hidden');
                
                this.updatePolarity(0); // Force Void
                notify("MISSION START", "white");
            },

            togglePause() {
                STATE.paused = !STATE.paused;
                const menu = document.getElementById('pause-menu');
                if(STATE.paused) menu.classList.add('active');
                else menu.classList.remove('active');
            },

            quit() {
                STATE.active = false;
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('pause-menu').classList.remove('active');
                document.getElementById('game-over').classList.remove('active');
                document.getElementById('main-menu').classList.add('active');
            },

            gameOver() {
                STATE.gameOver = true; STATE.active = false;
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over').classList.add('active');
                document.getElementById('final-score').innerText = STATE.score;
            },

            fire() {
                if(!STATE.active || STATE.paused) return;
                
                const col = STATE.polarity === 0 ? COLORS.void : COLORS.matter;
                const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 2, 4), new THREE.MeshBasicMaterial({ color: col }));
                b.rotation.x = Math.PI/2; // Orient forward
                b.position.copy(ship.position); b.position.y += 3;
                
                // Add Light to bullet for visuals
                const light = new THREE.PointLight(col, 1, 8);
                b.add(light);
                
                b.userData = { type: STATE.polarity, active: true };
                scene.add(b);
                bullets.push(b);
                
                // Recul
                STATE.shake += 0.2;
            },

            updatePolarity() {
                STATE.polarity = 1 - STATE.polarity;
                const isVoid = STATE.polarity === 0;
                const col = isVoid ? COLORS.void : COLORS.matter;
                
                // Visuals
                engineLight.color.setHex(col);
                backLight.color.setHex(col);
                
                // HUD
                const icon = document.getElementById('polarity-icon');
                const text = document.getElementById('polarity-text');
                icon.style.borderColor = isVoid ? 'var(--void)' : 'var(--matter)';
                icon.style.boxShadow = `0 0 20px ${isVoid ? 'var(--void)' : 'var(--matter)'}`;
                icon.style.background = isVoid ? 'rgba(0, 243, 255, 0.1)' : 'rgba(255, 0, 85, 0.1)';
                text.innerText = `SYSTEM: ${isVoid ? 'VOID' : 'MATTER'}`;
                text.style.color = isVoid ? 'var(--void)' : 'var(--matter)';
            }
        };

        // --- INPUTS ---
        const mouse = new THREE.Vector2();
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            const c = document.getElementById('cursor');
            c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px';
        });

        window.addEventListener('mousedown', e => {
            if(e.button === 0) GAME.fire();
            if(e.button === 2) GAME.updatePolarity();
        });
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('keydown', e => {
            if(e.code === 'Space') GAME.updatePolarity();
            if(e.code === 'Escape') GAME.togglePause();
        });

        // --- MAIN LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Shaders Uniforms
            glitchPass.uniforms['seed'].value = Math.random();
            if(STATE.glitch > 0) {
                STATE.glitch *= 0.9;
                glitchPass.uniforms['amount'].value = STATE.glitch;
            } else {
                glitchPass.uniforms['amount'].value = 0;
            }

            // Camera Shake
            if(STATE.shake > 0) {
                camera.position.x = (Math.random()-0.5) * STATE.shake;
                camera.position.y = -10 + (Math.random()-0.5) * STATE.shake;
                STATE.shake *= 0.9;
            } else {
                // Smooth Reset
                camera.position.x += (0 - camera.position.x) * 0.1;
                camera.position.y += (-10 - camera.position.y) * 0.1;
            }

            if(STATE.active && !STATE.paused) {
                STATE.frame++;

                // Movement Logic
                const targetX = mouse.x * LIMITS.x;
                const targetY = (mouse.y * 15) - 15;
                ship.position.x += (targetX - ship.position.x) * 0.12;
                ship.position.y += (targetY - ship.position.y) * 0.12;
                ship.rotation.z = (targetX - ship.position.x) * -0.06; // Bank
                ship.rotation.x = -Math.PI/2 + (targetY - ship.position.y) * 0.05;

                // Spawning
                if(STATE.frame % 50 === 0) spawnEnemy();

                // Bullets Logic
                for(let i=bullets.length-1; i>=0; i--) {
                    const b = bullets[i];
                    b.position.y += 3;
                    
                    // Hit Test
                    let hit = false;
                    for(let j=enemies.length-1; j>=0; j--) {
                        const e = enemies[j];
                        if(b.position.distanceTo(e.position) < 4) {
                            hit = true;
                            // Remove bullet
                            scene.remove(b); bullets.splice(i, 1);
                            
                            // Create Impact
                            createExplosion(b.position, b.userData.type===0 ? COLORS.void : COLORS.matter, 0.5);

                            const dmg = (b.userData.type === e.userData.type) ? 30 : 10;
                            e.userData.hp -= dmg;
                            
                            if(e.userData.hp <= 0) {
                                // Destroy Enemy
                                createExplosion(e.position, COLORS.gold, 2);
                                scene.remove(e); enemies.splice(j, 1);
                                STATE.score += 500;
                                STATE.shake += 0.5;
                                document.getElementById('score').innerText = STATE.score.toString().padStart(6, '0');
                            }
                            break;
                        }
                    }
                    if(!hit && b.position.y > 60) { scene.remove(b); bullets.splice(i, 1); }
                }

                // Enemy Logic
                for(let i=enemies.length-1; i>=0; i--) {
                    const e = enemies[i];
                    e.position.y -= 0.35;
                    e.rotation.y += 0.03;
                    e.children[1].rotation.x += 0.05; 
                    e.children[2].rotation.z -= 0.05;

                    // Shoot
                    if(Math.random() < 0.02) {
                        const eb = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshBasicMaterial({ color: e.userData.type===0 ? COLORS.void : COLORS.matter }));
                        eb.position.copy(e.position);
                        eb.userData = { type: e.userData.type };
                        scene.add(eb);
                        enemyBullets.push(eb);
                    }

                    if(e.position.y < -50) { scene.remove(e); enemies.splice(i, 1); }
                }

                // Enemy Bullets Logic
                for(let i=enemyBullets.length-1; i>=0; i--) {
                    const eb = enemyBullets[i];
                    eb.position.y -= 0.9;
                    
                    if(eb.position.distanceTo(ship.position) < 2.5) {
                        scene.remove(eb); enemyBullets.splice(i, 1);
                        
                        if(eb.userData.type === STATE.polarity) {
                            // Absorb
                            STATE.score += 100;
                            STATE.hp = Math.min(100, STATE.hp + 5);
                            createExplosion(ship.position, COLORS.gold, 0.3);
                        } else {
                            // Damage
                            STATE.hp -= 20;
                            STATE.shake += 1.5;
                            STATE.glitch += 1.0;
                            createExplosion(ship.position, COLORS.matter, 1);
                            
                            // Visual Damage Overlay
                            const overlay = document.getElementById('damage-fx');
                            overlay.style.boxShadow = `inset 0 0 100px 50px ${COLORS.matter}`;
                            setTimeout(() => overlay.style.boxShadow = 'none', 200);
                        }

                        // HUD Update
                        const hpEl = document.getElementById('hp');
                        hpEl.innerText = Math.max(0, Math.floor(STATE.hp)) + "%";
                        document.getElementById('score').innerText = STATE.score.toString().padStart(6, '0');

                        if(STATE.hp <= 0) GAME.gameOver();
                    } else if(eb.position.y < -50) {
                        scene.remove(eb); enemyBullets.splice(i, 1);
                    }
                }

                // Particles Logic
                for(let i=particles.length-1; i>=0; i--) {
                    const p = particles[i];
                    p.life -= 0.05;
                    p.mesh.position.add(p.vel);
                    p.mesh.scale.multiplyScalar(0.9);
                    if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
                }

                // Warp Grid Animation
                gridHelper.position.z += 1.0;
                if(gridHelper.position.z > 0) gridHelper.position.z = -50;
            } else {
                // Idle Animation
                ship.position.y = -20 + Math.sin(Date.now()*0.002)*2;
                ship.rotation.z = Math.cos(Date.now()*0.001)*0.1;
                gridHelper.position.z += 0.2;
                if(gridHelper.position.z > 0) gridHelper.position.z = -50;
            }

            // Starfield
            const pos = stars.geometry.attributes.position.array;
            for(let i=2; i<pos.length; i+=3) {
                pos[i] += 2.0;
                if(pos[i] > 400) pos[i] = -400;
            }
            stars.geometry.attributes.position.needsUpdate = true;

            composer.render();
        }

        animate();

    </script>
</body>
</html>
